apiVersion: apps/v1
kind: Deployment
metadata:
  name: resortsLite
  namespace: resortsLite
  labels:
    app: resortsLite
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resortsLite
  template:
    metadata:
      labels:
        app: resortsLite
        version: "1.0.0"
    spec:
      containers:
        - name: resortsLite
          image: "{{IMAGE_URI}}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: SERVER_PORT
              value: "8080"
            - name: REDIS_HOST
              value: "{{REDIS_HOST}}"
            - name: REDIS_PORT
              value: "{{REDIS_PORT}}"
            - name: S3_BUCKET_NAME
              value: "{{S3_BUCKET_NAME}}"
            - name: S3_BACKUP_PREFIX
              value: "{{S3_BACKUP_PREFIX}}"
            - name: PAYMENT_API_ENDPOINT
              value: "{{PAYMENT_API_ENDPOINT}}"
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"
            - name: TZ
              value: "UTC"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      terminationGracePeriodSeconds: 60
