apiVersion: apps/v1
kind: Deployment
metadata:
  name: resortlite-mono2
  namespace: resortlite-mono2
  labels:
    app: resortlite-mono2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resortlite-mono2
  template:
    metadata:
      labels:
        app: resortlite-mono2
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: resortlite-mono2
          image: "{{IMAGE_URI}}"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: APP_PORT
              value: "8080"
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: JAVA_OPTS
              value: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
            - name: REPORT_PATH
              value: "/app/reports"
            - name: BACKUP_PATH
              value: "/app/backups/nightly"
            - name: PAYMENT_API_URL
              value: "{{PAYMENT_API_URL}}"
            - name: REDIS_HOST
              value: "{{REDIS_HOST}}"
            - name: REDIS_PORT
              value: "{{REDIS_PORT}}"
            - name: REDIS_SSL
              value: "{{REDIS_SSL}}"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: resortlite-mono2-secrets
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: reports
              mountPath: /app/reports
            - name: backups
              mountPath: /app/backups
      volumes:
        - name: reports
          emptyDir: {}
        - name: backups
          emptyDir: {}
