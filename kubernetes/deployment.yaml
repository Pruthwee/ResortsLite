apiVersion: apps/v1
kind: Deployment
metadata:
  name: resortslite
  namespace: resortslite
  labels:
    app: resortslite
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resortslite
  template:
    metadata:
      labels:
        app: resortslite
    spec:
      containers:
        - name: resortslite
          image: "{{IMAGE_URI}}"
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: DB_URL
              value: "{{DB_URL}}"
            - name: DB_USERNAME
              value: "{{DB_USERNAME}}"
            - name: DB_PASSWORD
              value: "{{DB_PASSWORD}}"
            - name: PAYMENT_ENDPOINT
              value: "{{PAYMENT_ENDPOINT}}"
            - name: INVENTORY_ENDPOINT
              value: "{{INVENTORY_ENDPOINT}}"
            - name: NOTIFICATION_ENDPOINT
              value: "{{NOTIFICATION_ENDPOINT}}"
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
