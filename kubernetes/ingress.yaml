apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: restorelitecontainer-ingress
  namespace: restorelitecontainer
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
    appgw.ingress.kubernetes.io/backend-path-prefix: "/"
spec:
  rules:
    - host: restorelitecontainer.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: restorelitecontainer-service
                port:
                  number: 80
