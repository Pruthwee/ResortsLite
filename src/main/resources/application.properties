# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=8080

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# AWS S3 Configuration for Report Storage

# AWS Systems Manager Parameter Store - Parameter Names
# These define the SSM parameter paths for externalized environment-specific URLs

# Spring Session - Redis Configuration for Distributed Session Management
# FIXED cr-java-0065: Migrated HTTP session storage to Amazon ElastiCache for Redis
# This enables stateless application instances with centralized session management
spring.session.store-type=redis
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=spring:session

# Redis Connection Configuration (AWS ElastiCache)
# Use environment variables or AWS Parameter Store for production values
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0

# AWS Cognito Configuration for User Identity Management
# FIXED cr-java-0090: Added AWS Cognito for cloud-native authentication
# Replace file-based authentication with centralized identity management
aws.cognito.user.pool.id=${COGNITO_USER_POOL_ID:}
aws.cognito.enabled=${COGNITO_ENABLED:false}

# AWS Secrets Manager Configuration
aws.secretsmanager.secret.name=${SECRETS_MANAGER_SECRET_NAME:resorts-lite-db-credentials}
aws.region=${AWS_REGION:us-east-1}
