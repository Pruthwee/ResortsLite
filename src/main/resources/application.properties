# ResortsLite - Cloud-Native Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
# REMEDIATION cr-java-0069: Database credentials externalized to environment variables
# In AWS, these are populated from AWS Secrets Manager at deployment time
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# AWS Secrets Manager configuration for database credentials
app.db.secret.name=${DB_SECRET_NAME:resorts-lite/db-credentials}
app.aws.region=${AWS_REGION:us-east-1}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# S3 configuration for cloud-native report storage (replaces local file system writes)
app.s3.bucket=${S3_BUCKET:resorts-lite-reports}
app.s3.region=${AWS_REGION:us-east-1}

# REMEDIATION cr-java-0067: Amazon ElastiCache for Redis configuration
# Replaces unbounded in-memory caching (HashMap) with centralized Redis cache
# with TTL policies for controlled expiration and consistent data across instances
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.timeout=${REDIS_TIMEOUT:2000}
spring.redis.lettuce.pool.max-active=${REDIS_POOL_MAX_ACTIVE:8}
spring.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX_IDLE:8}
spring.redis.lettuce.pool.min-idle=${REDIS_POOL_MIN_IDLE:0}
# Cache TTL in seconds - ensures controlled expiration and prevents stale data
app.cache.ttl.seconds=${CACHE_TTL_SECONDS:3600}
