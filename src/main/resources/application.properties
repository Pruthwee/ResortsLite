# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# -----------------------------------------------------------------------
# cr-java-0077 fix: Hard-coded Ports
# The previously hard-coded port 8080 (original ReportService.java line 28:
#   private static final int SERVER_PORT = 8080;
# and server.port=8080 in this file) has been replaced with an environment
# variable backed by AWS Systems Manager Parameter Store.
# Set SERVER_PORT in the ECS task definition / EKS pod spec / Elastic Beanstalk
# environment, sourced from SSM parameter /resorts/<env>/server/port.
# -----------------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# -----------------------------------------------------------------------
# Amazon S3 configuration (cr-java-0061 fix)
# Hard-coded file-system paths (/var/legacy/reports/, C:\ResortBackups\...)
# have been replaced with S3 object storage.
# Override these values via environment variables or AWS Parameter Store.
# -----------------------------------------------------------------------
# AWS region — can also be set via the AWS_REGION environment variable
cloud.aws.region=${AWS_REGION:us-east-1}

# S3 bucket that holds generated reports
cloud.aws.s3.bucket-name=${REPORTS_S3_BUCKET:resorts-reports-bucket}

# S3 key prefix for monthly reports (replaces /var/legacy/reports/)
cloud.aws.s3.report-prefix=${REPORTS_S3_PREFIX:reports/}

# S3 key prefix for nightly backups (replaces C:\ResortBackups\nightly\)
cloud.aws.s3.backup-prefix=${BACKUP_S3_PREFIX:backups/nightly/}

# -----------------------------------------------------------------------
# AWS Secrets Manager configuration (cr-java-0069 fix)
# Hard-coded DB_USER / DB_PASS constants have been removed from BookingService.
# At startup the application fetches credentials from the secret identified by
# DB_SECRET_NAME.  The secret must be a JSON object:
#   {"username":"<db-user>","password":"<db-password>"}
# Override via environment variables or AWS Parameter Store.
# -----------------------------------------------------------------------
# ARN or friendly name of the Secrets Manager secret holding DB credentials
app.db.secret-name=${DB_SECRET_NAME:resorts/prod/db-credentials}

# Database host — externalised from the former hard-coded DB_HOST constant
app.db.host=${DB_HOST:db-prod.resorts-internal.com}

# -----------------------------------------------------------------------
# cr-java-0071 fix: Hard-coded Environment URLs
# The following two properties replace hard-coded environment-specific URLs
# that were embedded directly in source code.  Each property is bound to an
# environment variable that is populated at deployment time from
# AWS Systems Manager Parameter Store (SSM), enabling environment-agnostic
# deployments without any code change between dev / staging / production.
#
# SSM parameter path convention (recommended):
#   /resorts/<env>/inventory/available-url
#   /resorts/<env>/reports/download-base-url
# -----------------------------------------------------------------------

# Inventory service availability endpoint
# Replaces hard-coded "http://inventory-service.internal:8081/rooms/available"
# in BookingController (original line 66).
# Populate APP_INVENTORY_AVAILABLE_URL from SSM at deployment time.
app.inventory.available-url=${APP_INVENTORY_AVAILABLE_URL:https://inventory-service.internal:8081/rooms/available}

# Report download base URL
# Replaces hard-coded "http://reports.resorts-internal.com:8080/download/"
# in ReportService (original line 66).
# Populate APP_REPORTS_DOWNLOAD_BASE_URL from SSM at deployment time.
app.reports.download-base-url=${APP_REPORTS_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com/download/}

# -----------------------------------------------------------------------
# cr-java-0065 fix: Amazon ElastiCache for Redis — Spring Session Data Redis
# All HTTP session state (previously stored in JVM heap memory) is now
# persisted to the shared ElastiCache Redis cluster via Spring Session.
# This makes application instances fully stateless and horizontally scalable
# behind an AWS Application Load Balancer without sticky sessions.
#
# Set the following environment variables (or AWS SSM parameters) at
# deployment time:
#   SPRING_REDIS_HOST     – ElastiCache primary endpoint hostname
#                           SSM: /resorts/<env>/redis/host
#   SPRING_REDIS_PORT     – ElastiCache port (default: 6379)
#                           SSM: /resorts/<env>/redis/port
#   SPRING_REDIS_PASSWORD – ElastiCache AUTH token (omit if AUTH disabled)
#                           Secrets Manager: resorts/<env>/redis-auth-token
#   SESSION_TIMEOUT_SECONDS – session TTL in seconds (default: 1800 = 30 min)
#                           SSM: /resorts/<env>/session/timeout-seconds
# -----------------------------------------------------------------------

# ElastiCache primary endpoint hostname
spring.redis.host=${SPRING_REDIS_HOST:localhost}

# ElastiCache port
spring.redis.port=${SPRING_REDIS_PORT:6379}

# ElastiCache AUTH token (leave blank if AUTH is not enabled)
spring.redis.password=${SPRING_REDIS_PASSWORD:}

# Spring Session store type — must be 'redis' to activate Spring Session Data Redis
spring.session.store-type=redis

# Session timeout (TTL in Redis); mirrors @EnableRedisHttpSession maxInactiveIntervalInSeconds
server.servlet.session.timeout=${SESSION_TIMEOUT_SECONDS:1800}s

# -----------------------------------------------------------------------
# cr-java-0090 fix: Amazon Cognito User Pool — File-based Authentication
# Authentication credentials and user identity data that were previously
# stored in local files or hard-coded in source code have been migrated to
# AWS-managed services:
#   - AWS Secrets Manager: stores all sensitive credentials (DB creds,
#     Cognito client secret) in an encrypted, auditable secret store.
#   - Amazon Cognito User Pool: provides centralised, scalable user identity
#     management, replacing any file-based user store or local credential file.
#
# Set the following environment variables (or AWS SSM parameters) at
# deployment time:
#   COGNITO_USER_POOL_ID         – Cognito User Pool ID
#                                  SSM: /resorts/<env>/cognito/user-pool-id
#   COGNITO_CLIENT_ID            – Cognito App Client ID
#                                  SSM: /resorts/<env>/cognito/client-id
#   COGNITO_CLIENT_SECRET_NAME   – Secrets Manager secret name holding the
#                                  Cognito App Client secret
#                                  e.g. resorts/prod/cognito-client-secret
# -----------------------------------------------------------------------

# Amazon Cognito User Pool ID
# Replaces any file-based user store (e.g. users.properties, auth.txt)
app.cognito.user-pool-id=${COGNITO_USER_POOL_ID:us-east-1_ResortPool}

# Amazon Cognito App Client ID
app.cognito.client-id=${COGNITO_CLIENT_ID:resort-app-client-id}

# Secrets Manager secret name holding the Cognito App Client secret
# The client secret is stored in Secrets Manager rather than in a local file
app.cognito.client-secret-name=${COGNITO_CLIENT_SECRET_NAME:resorts/prod/cognito-client-secret}

# -----------------------------------------------------------------------
# cr-java-0067 fix: Amazon ElastiCache for Redis — Booking Cache with TTL
# The unbounded in-memory HashMap (bookingCache) in BookingController has been
# replaced with a Redis-backed cache using Spring Data RedisTemplate.
# Each booking entry is stored in ElastiCache with a configurable TTL to prevent
# indefinite memory growth, ensure stale data is automatically evicted, and
# provide a consistent shared cache across all EC2 instances in the Auto Scaling
# Group.
#
# Set the following environment variable (or AWS SSM parameter) at deployment time:
#   BOOKING_CACHE_TTL_SECONDS – TTL in seconds for each cached booking entry
#                               (default: 3600 = 1 hour)
#                               SSM: /resorts/<env>/booking/cache-ttl-seconds
# -----------------------------------------------------------------------

# TTL for booking cache entries in Amazon ElastiCache for Redis (seconds)
# Replaces the former unbounded in-memory HashMap that had no expiration policy
app.booking.cache.ttl-seconds=${BOOKING_CACHE_TTL_SECONDS:3600}
