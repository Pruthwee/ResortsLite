# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# FIXED cr-java-0077: Port now configured via environment variable from AWS Parameter Store
# Set SERVER_PORT environment variable in ECS task definition, EKS deployment, or Elastic Beanstalk
# Example: SERVER_PORT can be retrieved from AWS Systems Manager Parameter Store at runtime
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# AWS S3 Configuration for Report Storage (replaces hard-coded file paths)
# These values should be externalized to AWS Parameter Store or environment variables in production
aws.s3.bucket.name=${AWS_S3_BUCKET_NAME:resorts-reports-bucket}
aws.s3.region=${AWS_REGION:us-east-1}
aws.s3.reports.prefix=reports/
aws.s3.backups.prefix=backups/nightly/

# AWS Secrets Manager Configuration for Database Credentials
# Secret should contain JSON: {"host": "...", "username": "...", "password": "..."}
aws.secretsmanager.secret.name=${AWS_SECRET_NAME:resorts-db-credentials}
aws.region=${AWS_REGION:us-east-1}

# Amazon ElastiCache for Redis Configuration (Spring Session)
# FIXED cr-java-0065: HTTP session state now stored in Redis for stateless horizontal scaling
# Redis endpoint should be externalized to AWS Parameter Store or environment variables
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}
spring.redis.timeout=2000ms
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0
spring.session.store-type=redis
spring.session.redis.namespace=resortslite:session

# Amazon ElastiCache for Redis - Cache Configuration
# FIXED cr-java-0067: Distributed caching with TTL to replace in-memory HashMap
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false
