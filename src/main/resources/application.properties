# ResortsLite - Cloud-Ready Configuration
# cr-java-0077: Server port externalized to environment variable
server.port=${PORT:8080}

spring.application.name=ResortsLite

# cr-java-0069: Database credentials from AWS Secrets Manager (DB_SECRET_NAME)
# H2 in-memory database retained for project's own tests
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# cr-java-0077: Hardcoded internal service endpoints externalized to environment variables
app.payment.endpoint=${APP_PAYMENT_ENDPOINT:http://payment-svc.internal:9090/charge}
app.inventory.endpoint=${APP_INVENTORY_ENDPOINT:http://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${APP_NOTIFICATION_ENDPOINT:http://notify.internal:7070/send}

# cr-java-0061/0062/0063: S3 bucket and key prefix for report storage
aws.s3.bucket.name=${APP_S3_BUCKET}
aws.s3.key.prefix=${APP_S3_KEY_PREFIX:reports/}

# cr-java-0065/0067: Redis (ElastiCache) configuration
spring.session.store-type=redis
spring.redis.host=${ELASTICACHE_ENDPOINT:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.ssl=false
spring.session.timeout=1800s
spring.session.redis.namespace=spring:session
spring.session.redis.flush-mode=on_save

# Safe logging: prevent AWS SDK wire logs from leaking secrets
logging.level.software.amazon.awssdk=WARN
logging.level.software.amazon.awssdk.request=WARN
logging.level.org.apache.http.wire=WARN
logging.level.org.apache.http.headers=WARN
logging.level.com.zaxxer.hikari=INFO
