# ResortsLite - Cloud-Ready Configuration for GCP
# All values can be overridden by environment variables

spring.application.name=ResortsLite

# FIXED cr-java-0077: Dynamic port binding for cloud environments
# PORT environment variable is used by Cloud Run and other GCP services
server.port=${PORT:8080}

# FIXED cr-java-0069: Database configuration using environment variables
# These should be populated from Google Secret Manager in production
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# H2 Console (disable in production)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# FIXED cr-java-0065, cr-java-0067: Redis configuration for distributed session and cache
# Using Google Cloud Memorystore for Redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}
spring.redis.timeout=${REDIS_TIMEOUT:2000}

# Redis connection pool configuration
spring.redis.lettuce.pool.max-active=${REDIS_POOL_MAX_ACTIVE:8}
spring.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX_IDLE:8}
spring.redis.lettuce.pool.min-idle=${REDIS_POOL_MIN_IDLE:0}
spring.redis.lettuce.pool.max-wait=${REDIS_POOL_MAX_WAIT:-1}

# FIXED cr-java-0065: Spring Session configuration for distributed session management
spring.session.store-type=redis
spring.session.redis.namespace=resortslite:session
spring.session.timeout=${SESSION_TIMEOUT:1800}

# FIXED cr-java-0061, cr-java-0062, cr-java-0063: Google Cloud Storage configuration
gcs.reports.bucket=${GCS_REPORTS_BUCKET:resort-reports-bucket}
gcs.backup.bucket=${GCS_BACKUP_BUCKET:resort-backups-bucket}

# FIXED cr-java-0069, cr-java-0090: Google Cloud Project configuration for Secret Manager
gcp.project.id=${GCP_PROJECT_ID:}
spring.cloud.gcp.project-id=${GCP_PROJECT_ID:}

# FIXED cr-java-0071: Externalized service endpoints using environment variables
# All URLs now use HTTPS and are configurable per environment
app.payment.endpoint=${PAYMENT_API_URL:https://payment-svc.resorts-cloud.com/charge}
app.inventory.endpoint=${INVENTORY_SERVICE_URL:https://inventory-svc.resorts-cloud.com/rooms}
app.notification.endpoint=${NOTIFICATION_SERVICE_URL:https://notify.resorts-cloud.com/send}
app.report.download.url=${REPORT_DOWNLOAD_URL:https://reports.resorts-cloud.com}

# Logging configuration for cloud environments
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.demo.resortslite=${APP_LOG_LEVEL:DEBUG}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator endpoints for health checks (required for Cloud Run, GKE)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.redis.enabled=true

# FIXED cr-java-0111: Ensure UTC timezone for all date/time operations
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSZ
