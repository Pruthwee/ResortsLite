# ResortsLite - Cloud-Ready Configuration
spring.application.name=ResortsLite

# ── Spring Session / Amazon ElastiCache for Redis (cr-java-0065 fix) ─────────
# Spring Session Data Redis stores all HttpSession attributes in the shared
# Redis cluster so that every application instance behind the AWS ALB can
# serve any request without server affinity.
#
# Override the following properties via environment variables in your ECS task
# definition, EKS pod spec, or Elastic Beanstalk environment configuration:
#   REDIS_HOST  — ElastiCache primary endpoint (e.g. my-cluster.abc123.ng.0001.use1.cache.amazonaws.com)
#   REDIS_PORT  — Redis port (default 6379; use 6380 for TLS)
#   REDIS_SSL   — set to "true" when connecting to ElastiCache with in-transit encryption
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session
spring.redis.host=${REDIS_HOST:127.0.0.1}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.ssl=${REDIS_SSL:false}
# Session TTL — 30 minutes (matches @EnableRedisHttpSession maxInactiveIntervalInSeconds)
spring.session.timeout=1800s
# ─────────────────────────────────────────────────────────────────────────────

# ── Amazon S3 configuration (cr-java-0062 fix) ──────────────────────────────
# Bucket name and key prefixes are externalised; override via environment
# variables (CLOUD_AWS_S3_BUCKET_NAME, etc.) or AWS Parameter Store at runtime.
cloud.aws.s3.bucket-name=${REPORTS_S3_BUCKET:resorts-lite-reports}
cloud.aws.s3.report-prefix=${REPORTS_S3_PREFIX:reports/}
cloud.aws.s3.backup-prefix=${BACKUP_S3_PREFIX:backups/nightly/}
cloud.aws.region.static=${AWS_REGION:us-east-1}

# ── AWS SSM Parameter Store — environment URL parameters (cr-java-0071 fix) ─
# These properties hold the SSM parameter *names* (paths) from which the
# application retrieves environment-specific service URLs at runtime.
# Override via environment variables to point to different SSM paths per env.
app.ssm.inventory-url-param=${APP_SSM_INVENTORY_URL_PARAM:/resortslite/inventory/service-url}
app.ssm.report-download-url-param=${APP_SSM_REPORT_DOWNLOAD_URL_PARAM:/resortslite/reports/download-base-url}
# ─────────────────────────────────────────────────────────────────────────────

# cr-java-0077 FIX: Hard-coded port 8080 replaced with environment variable injection.
# Set the PORT environment variable in ECS task definition, EKS pod spec, or
# Elastic Beanstalk environment configuration. Falls back to 8080 for local dev only.
server.port=${PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# ── AWS Secrets Manager configuration (cr-java-0069 fix) ────────────────────
# DB_SECRET_NAME: name/ARN of the AWS Secrets Manager secret that holds the
# database credentials JSON {"username":"...","password":"..."}.
# Override via environment variable DB_SECRET_NAME at runtime.
# DB_HOST: externalised database hostname — override via environment variable.
# Hard-coded values (admin / Resort$Pass#2019!) have been removed from source.
DB_SECRET_NAME=${DB_SECRET_NAME:resortslite/db/credentials}
DB_HOST=${DB_HOST:db-prod.resorts-internal.com}
# ─────────────────────────────────────────────────────────────────────────────

# ── Amazon Cognito configuration (cr-java-0090 fix) ─────────────────────────
# Replaces file-based authentication credential and user-data storage with
# Amazon Cognito User Pools. Guest identities are registered in Cognito at
# booking creation time, providing centralised, encrypted, and auditable
# authentication with built-in user lifecycle management.
#
# Override the following properties via environment variables in your ECS task
# definition, EKS pod spec, or Elastic Beanstalk environment configuration:
#   COGNITO_USER_POOL_ID — the Cognito User Pool ID (e.g. us-east-1_AbCdEfGhI)
# Leave empty for local development (Cognito integration is skipped gracefully).
COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID:}
# ─────────────────────────────────────────────────────────────────────────────

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send
