# ResortsLite - Cloud-Native Configuration
spring.application.name=ResortsLite

# Server port: read from environment variable (injected by ECS/EKS/Elastic Beanstalk at runtime)
# Blocker cr-java-0077: Hard-coded port replaced with environment variable injection
server.port=${SERVER_PORT:8080}

# Database configuration: credentials externalized via AWS Secrets Manager
# Blocker cr-java-0069: Hard-coded DB credentials replaced with environment variable references
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# AWS S3 configuration for cloud-native object storage
# Blocker cr-java-0061/0062/0063: File system paths replaced with S3 bucket references
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:resorts-lite-reports}
aws.s3.region=${AWS_REGION:us-east-1}

# AWS Secrets Manager configuration
# Blocker cr-java-0069: Secret name for DB credentials stored in Secrets Manager
aws.secretsmanager.db-secret-name=${AWS_DB_SECRET_NAME:resortslite/db/credentials}

# AWS SSM Parameter Store configuration
# Blocker cr-java-0071: Environment-specific URLs externalized to Parameter Store
aws.ssm.report-download-url-param=${AWS_SSM_REPORT_URL_PARAM:/resortslite/report/download-url}
aws.ssm.payment-api-url-param=${AWS_SSM_PAYMENT_URL_PARAM:/resortslite/payment/api-url}

# Service endpoints: externalized from hard-coded values via environment variables
# Blocker cr-java-0071: Hard-coded environment URLs replaced with environment variable references
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal:7070/send}

# Spring Session: use Redis (Amazon ElastiCache) for distributed session management
# Blocker cr-java-0065: HTTP session state migrated to ElastiCache for Redis
spring.session.store-type=redis
spring.session.timeout=1800

# Redis / ElastiCache configuration
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}

# Spring Cache: Redis-backed cache with TTL for distributed caching
# Blocker cr-java-0067: In-memory cache without TTL replaced with ElastiCache for Redis
spring.cache.type=redis
spring.cache.redis.time-to-live=300000
spring.cache.redis.cache-null-values=false
