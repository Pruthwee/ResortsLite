# ResortsLite - Cloud-Ready Configuration
spring.application.name=ResortsLite

# Externalized server port for ECS/EKS dynamic binding (cr-java-0077)
server.port=${PORT:8080}

# Database (H2 in-memory - project's own test database, kept as-is)
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# S3 bucket for report storage (cr-java-0061/0062/0063)
aws.s3.bucket.name=${S3_BUCKET_NAME:resort-reports}

# SSM Parameter Store path for externalized URLs (cr-java-0071)
app.parameter.path=${APP_PARAMETER_PATH:/resortslite/config/}

# Redis configuration for Spring Session and cache (cr-java-0065/0067)
spring.redis.host=${ELASTICACHE_ENDPOINT:localhost}
spring.redis.port=6379
spring.session.store-type=redis
spring.session.timeout=1800s

# Safe logging: prevent SDK wire/request logs from leaking secrets (cloud-services skill)
logging.level.software.amazon.awssdk=WARN
logging.level.software.amazon.awssdk.request=WARN
logging.level.org.apache.http.wire=WARN
logging.level.org.apache.http.headers=WARN
logging.level.com.zaxxer.hikari=INFO
