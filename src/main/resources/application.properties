# ---------------------------------------------------------------------------
# Amazon ElastiCache for Redis — distributed booking cache with TTL (cr-java-0067 fix)
# ---------------------------------------------------------------------------
# Replaces the former unbounded in-memory HashMap (bookingCache) in BookingController
# with a shared Redis cache backed by Amazon ElastiCache.  Every cache entry is written
# with an explicit TTL so entries expire automatically, preventing indefinite memory
# growth and stale-data inconsistencies across multiple EC2 instances.
#
# Override via environment variable: APP_CACHE_BOOKING_TTL_MINUTES
# Recommended production value: 30 minutes (1800 seconds)
app.cache.booking-ttl-minutes=${APP_CACHE_BOOKING_TTL_MINUTES:30}

# Redis key namespace prefix for booking cache entries (cr-java-0067)
app.cache.booking-key-prefix=booking:cache:

# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=8080

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# Amazon S3 configuration — replaces hard-coded absolute file paths (cr-java-0061).
# Override these values via environment variables in your AWS deployment environment:
#   CLOUD_AWS_S3_BUCKET_NAME, CLOUD_AWS_S3_REPORT_PREFIX,
#   CLOUD_AWS_S3_BACKUP_PREFIX, CLOUD_AWS_REGION
cloud.aws.s3.bucket-name=${CLOUD_AWS_S3_BUCKET_NAME:resorts-lite-reports}
cloud.aws.s3.report-prefix=${CLOUD_AWS_S3_REPORT_PREFIX:reports/}
cloud.aws.s3.backup-prefix=${CLOUD_AWS_S3_BACKUP_PREFIX:backups/nightly/}
cloud.aws.region=${CLOUD_AWS_REGION:us-east-1}

# AWS Secrets Manager — database credentials (cr-java-0069).
# Set DB_SECRET_NAME environment variable in your AWS deployment environment to point
# to the Secrets Manager secret that holds {"username":"...","password":"..."}.
# The secret must be created in AWS Secrets Manager before deploying the application.
app.db.secret-name=${DB_SECRET_NAME:resortslite/db/credentials}

# AWS SSM Parameter Store — environment-specific URL configuration (cr-java-0071).
# These parameter names point to SSM Parameter Store entries that hold the actual URLs,
# enabling environment-agnostic deployments without code changes.
# Override via environment variables: SSM_INVENTORY_URL_PARAM, SSM_REPORT_DOWNLOAD_URL_PARAM
#
# Required SSM parameters to create in AWS before deploying:
#   /resortslite/inventory/service-url  -> e.g. https://inventory-service.internal:8081/rooms/available
#   /resortslite/reports/download-base-url -> e.g. https://reports.resorts-internal.com/download/
app.ssm.inventory-url-param=${SSM_INVENTORY_URL_PARAM:/resortslite/inventory/service-url}
app.ssm.report-download-url-param=${SSM_REPORT_DOWNLOAD_URL_PARAM:/resortslite/reports/download-base-url}

# AWS SSM Parameter Store — server port configuration (cr-java-0077).
# Replaces the hard-coded SERVER_PORT = 8080 constant in ReportService.java (line 28).
# The parameter name points to an SSM Parameter Store entry that holds the actual port value,
# enabling dynamic port assignment required by ECS, EKS, and Elastic Beanstalk.
# Override via environment variable: SSM_SERVER_PORT_PARAM
#
# Required SSM parameter to create in AWS before deploying:
#   /resortslite/server/port  -> e.g. 8080
app.ssm.server-port-param=${SSM_SERVER_PORT_PARAM:/resortslite/server/port}

# ---------------------------------------------------------------------------
# Spring Session — Amazon ElastiCache for Redis (cr-java-0065 fix)
# ---------------------------------------------------------------------------
# Activates Spring Session's Redis-backed HttpSession store, replacing the
# default in-memory, server-local session store.  All session data is written
# to the shared ElastiCache Redis cluster so every application instance in the
# Auto Scaling Group reads the same session state, enabling true stateless
# horizontal scaling without sticky sessions.
#
# Override these values via environment variables in your AWS deployment:
#   SPRING_SESSION_STORE_TYPE, SPRING_REDIS_HOST, SPRING_REDIS_PORT,
#   SPRING_REDIS_PASSWORD, SPRING_SESSION_TIMEOUT
spring.session.store-type=redis
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.password=${SPRING_REDIS_PASSWORD:}
# Session timeout — default 30 minutes; override with SPRING_SESSION_TIMEOUT env var
spring.session.timeout=${SPRING_SESSION_TIMEOUT:1800s}
# Redis namespace prefix for session keys
spring.session.redis.namespace=resortslite:session

# ---------------------------------------------------------------------------
# Amazon Cognito — user identity management (cr-java-0090 fix)
# ---------------------------------------------------------------------------
# Replaces file-based authentication: user credentials and identity data are
# stored and managed in Amazon Cognito User Pools instead of local files.
# The application uses AdminInitiateAuth (ADMIN_USER_PASSWORD_AUTH flow) for
# guest authentication and AdminGetUser for profile retrieval.
#
# Override these values via environment variables in your AWS deployment:
#   APP_COGNITO_USER_POOL_ID  -> the Cognito User Pool ID (e.g. us-east-1_AbCdEfGhI)
#   APP_COGNITO_CLIENT_ID     -> the Cognito App Client ID configured for server-side auth
#
# The App Client must have ALLOW_ADMIN_USER_PASSWORD_AUTH enabled and must NOT
# require a client secret when called from the application server.
app.cognito.user-pool-id=${APP_COGNITO_USER_POOL_ID:us-east-1_CHANGEME}
app.cognito.client-id=${APP_COGNITO_CLIENT_ID:CHANGEME_CLIENT_ID}
