# ResortsLite - Cloud-Ready Configuration
spring.application.name=ResortsLite

server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# AWS S3 configuration for report storage (replaces /var/legacy/reports)
S3_REPORTS_BUCKET=${S3_REPORTS_BUCKET:reports-bucket}
S3_REPORTS_PREFIX=${S3_REPORTS_PREFIX:reports/}

# AWS Secrets Manager configuration for database credentials
DB_SECRET_NAME=${DB_SECRET_NAME:resortsLite/db-credentials}

# Internal service endpoints (read from environment, defaults preserve old behavior)
app.payment.endpoint=${PAYMENT_API_ENDPOINT:http://10.0.1.45:9090/payments/charge}
app.inventory.endpoint=${INVENTORY_API_ENDPOINT:http://inventory-service.internal:8081/rooms/available}
app.notification.endpoint=${NOTIFICATION_API_ENDPOINT:http://notify.internal:7070/send}

# Redis / ElastiCache configuration for distributed session storage (cr-java-0065) and caching (cr-java-0067)
spring.redis.host=${ELASTICACHE_ENDPOINT:localhost}
spring.redis.port=${ELASTICACHE_PORT:6379}
spring.redis.timeout=2000ms
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0

# Safe logging: prevent SDK wire/request logs from leaking secrets
logging.level.software.amazon.awssdk=WARN
logging.level.software.amazon.awssdk.request=WARN
logging.level.org.apache.http.wire=WARN
logging.level.org.apache.http.headers=WARN
