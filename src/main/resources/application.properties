# ResortsLite - Cloud-Ready Configuration
spring.application.name=ResortsLite

# Dynamic port assignment for ECS/EKS (cr-java-0077)
server.port=${PORT:8080}

# H2 in-memory database (project's own database, unchanged)
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Internal service endpoints (unchanged from original)
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# AWS S3 configuration (cr-java-0061, cr-java-0062, cr-java-0063 in ReportService.java)
app.reports.bucket=${APP_REPORTS_BUCKET:resorts-lite-reports}

# Spring Session Redis configuration (cr-java-0065 in BookingController.java)
spring.session.store-type=redis
spring.session.timeout=1800s
spring.session.redis.namespace=spring:session
spring.session.redis.flush-mode=on_save

# Redis connection for ElastiCache (cr-java-0065, cr-java-0067 in BookingController.java)
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.timeout=5000ms
spring.redis.lettuce.pool.max-active=20
spring.redis.lettuce.pool.max-idle=10
spring.redis.lettuce.pool.min-idle=5

# Safe logging: prevent cloud SDK wire/request logging of secrets
logging.level.software.amazon.awssdk=WARN
logging.level.software.amazon.awssdk.request=WARN
logging.level.org.apache.http.wire=WARN
logging.level.org.apache.http.headers=WARN
