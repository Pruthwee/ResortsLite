# ResortsLite - Configuration
spring.application.name=ResortsLite

# Application listen port — externalised for ECS/EKS dynamic binding
server.port=${PORT:8080}

# Database (H2 in-memory — project's own test database, kept as-is)
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Internal service endpoints (not in scope of analysis blockers)
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# AWS S3 — replaces hard-coded file paths (cr-java-0061/0062/0063)
aws.s3.bucket.name=${S3_BUCKET_NAME:resorts-lite-reports}

# AWS Secrets Manager — replaces hard-coded DB credentials (cr-java-0069)
DB_SECRET_NAME=${DB_SECRET_NAME:resorts-lite/db-credentials}

# Redis (ElastiCache) — for Spring Session (cr-java-0065) and cache (cr-java-0067)
spring.session.store-type=redis
spring.session.timeout=1800s
spring.redis.host=${ELASTICACHE_ENDPOINT:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.timeout=2000

# Safe logging — prevent SDK wire/data and secret logging
logging.level.software.amazon.awssdk=WARN
logging.level.software.amazon.awssdk.request=WARN
logging.level.org.apache.http.wire=WARN
logging.level.org.apache.http.headers=WARN
logging.level.io.lettuce.core=WARN
logging.level.redis.clients.jedis=WARN
