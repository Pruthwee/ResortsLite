# ResortsLite - Application Configuration
# All infrastructure values are externalised to environment variables.
# For AWS deployments, populate via AWS Parameter Store or Secrets Manager.

spring.application.name=ResortsLite

# Server port resolved from SERVER_PORT environment variable; defaults to 8080.
# Container orchestration platforms (ECS / EKS) can override this dynamically.
server.port=${SERVER_PORT:8080}

# Database connection — credentials must be supplied via environment variables.
# For production, use AWS RDS with credentials from AWS Secrets Manager.
# Example: export SPRING_DATASOURCE_URL=jdbc:mysql://rds-host:3306/resortdb
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# H2 console enabled for local development only.
# Disable in production: spring.h2.console.enabled=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Internal service endpoints — resolved from environment variables.
# Replace with actual service discovery URLs (e.g., AWS Cloud Map) in production.
app.payment.endpoint=${PAYMENT_API_URL:https://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_API_URL:https://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_API_URL:https://notify.internal:7070/send}

# Report configuration
app.report.base-path=${REPORT_BASE_PATH:/tmp/reports}
app.report.host=${REPORT_HOST:reports.resorts-internal.com}
app.backup.path=${BACKUP_PATH:/tmp/resort-backups/nightly}

# Logging configuration
logging.level.com.demo.resortslite=INFO
logging.level.org.springframework.jdbc=WARN
