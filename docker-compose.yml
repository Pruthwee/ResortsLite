services:
  resortlite-mono2:
    image: resortlite-mono2:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      APP_PORT: "8080"
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-prod}"
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
      REPORT_PATH: "/app/reports"
      BACKUP_PATH: "/app/backups/nightly"
      PAYMENT_API_URL: "${PAYMENT_API_URL:-http://payment-service:9090/payments/charge}"
      REDIS_HOST: "${REDIS_HOST:?set REDIS_HOST}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_SSL: "${REDIS_SSL:-false}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?set REDIS_PASSWORD}"
    volumes:
      - reports-data:/app/reports
      - backups-data:/app/backups
    restart: unless-stopped

volumes:
  reports-data:
  backups-data:
