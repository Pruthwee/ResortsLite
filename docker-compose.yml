version: '3.8'

services:
  resortslite:
    image: resortslite:latest
    ports:
      - "8080:8080"
    environment:
      - APP_PORT=8080
      - REDIS_HOST=${REDIS_HOST:?set REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT:?set REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD}
      - SERVER_PORT=8080
      - REPORT_PATH=/app/reports
      - BACKUP_PATH=/app/backups
      - PAYMENT_API_ENDPOINT=${PAYMENT_API_ENDPOINT:?set PAYMENT_API_ENDPOINT}
      - SPRING_PROFILES_ACTIVE=prod
      - TZ=UTC
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
    volumes:
      - ./reports:/app/reports
      - ./backups:/app/backups
