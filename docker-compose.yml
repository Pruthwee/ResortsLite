version: "3.8"
services:
  resortslite:
    image: resortslite:latest
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=${REDIS_HOST:?set REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT:?set REDIS_PORT}
      - REPORT_PATH=${REPORT_PATH:?set REPORT_PATH}
      - BACKUP_PATH=${BACKUP_PATH:?set BACKUP_PATH}
      - SERVER_PORT=${SERVER_PORT:?set SERVER_PORT}
      - PAYMENT_API_URL=${PAYMENT_API_URL:?set PAYMENT_API_URL}
      - DB_USERNAME=${DB_USERNAME:?set DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./backups:/app/backups
