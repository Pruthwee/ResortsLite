# ResortsLite - Cloud-Native Configuration
spring.application.name=ResortsLite

# Dynamic port assignment for container orchestration (ECS/EKS)
server.port=${SERVER_PORT:8080}

# Externalized database configuration via environment variables
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Externalized service endpoints via environment variables (HTTPS enforced)
app.payment.endpoint=${PAYMENT_API_ENDPOINT:https://payment-svc.internal:8443/charge}
app.inventory.endpoint=${INVENTORY_API_ENDPOINT:https://inventory-svc.internal:8443/rooms}
app.notification.endpoint=${NOTIFICATION_API_ENDPOINT:https://notify.internal:8443/send}
