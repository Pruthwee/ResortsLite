# ResortsLite - Legacy Configuration
spring.application.name=ResortsLite
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.payment.endpoint=${PAYMENT_API_URL:http://payment-service:9090/payments/charge}
app.inventory.endpoint=${INVENTORY_API_URL:https://inventory-service.internal:${INVENTORY_SERVICE_PORT:8081}/rooms/available}
app.notification.endpoint=http://notify.internal:7070/send
app.report.base-path=${REPORT_BASE_PATH:/tmp/reports}
app.backup.path=${BACKUP_PATH:/tmp/backups}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
