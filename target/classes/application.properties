# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=8080

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# blocker-4/5/6/7/8 (cz-java-0063, cz-java-0069): Spring Session backed by Amazon ElastiCache
# for Redis. REDIS_HOST and REDIS_PORT must be set as environment variables in ECS/EKS task
# definitions pointing to the ElastiCache Redis cluster endpoint.
spring.session.store-type=redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=resortslite:session

# blocker-13 (cz-java-0070): Redis connection reused for distributed cache via RedisTemplate.
# No additional configuration needed — spring-boot-starter-data-redis auto-configures it.

# blocker-1/2/3 (cz-java-0057): Amazon S3 bucket name and backup prefix for report storage.
# S3_BUCKET_NAME and S3_BACKUP_PREFIX must be set as environment variables in ECS/EKS.
app.s3.bucket=${S3_BUCKET_NAME:resorts-reports-bucket}
app.s3.backup.prefix=${S3_BACKUP_PREFIX:backups/nightly/}

# blocker-12 (cz-java-0062): Payment API endpoint resolved via environment variable.
# PAYMENT_API_ENDPOINT must be set as an environment variable in ECS/EKS task definitions.
app.payment.api.endpoint=${PAYMENT_API_ENDPOINT:http://payment-service/payments/charge}

# health-check-endpoint: Expose /actuator/health for container liveness/readiness probes.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
