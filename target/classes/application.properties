# ResortsLite - Legacy Configuration
spring.application.name=ResortsLite

# Port is now configurable via environment variable SERVER_PORT
server.port=${SERVER_PORT:8080}

# DB configuration externalised to environment variables
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Internal service endpoints externalised to environment variables
app.payment.endpoint=${PAYMENT_ENDPOINT:http://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:http://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:http://notify.internal:7070/send}

# Actuator health check configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
