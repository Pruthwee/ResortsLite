# ResortsLite — Java 21 / Spring Boot 3.2.x Configuration
spring.application.name=ResortsLite

# FIXED (czr-port-001): Port is now configurable via the SERVER_PORT environment variable.
# Container orchestration (ECS / EKS) can override this at runtime.
server.port=${SERVER_PORT:8080}

# FIXED (cr-java-0021): Datasource URL, username, and password are now driven by
# environment variables. For production, supply these via AWS Secrets Manager,
# Parameter Store, or ECS task-definition environment variables.
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}

# H2 console — disable in production environments
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# FIXED (cr-java-0021 / cr-java-0088): Internal service endpoints are now driven by
# environment variables and default to HTTPS. Override per environment.
app.payment.endpoint=${PAYMENT_API_URL:https://payment-svc.internal/charge}
app.inventory.endpoint=${INVENTORY_SERVICE_URL:https://inventory-svc.internal/rooms}
app.notification.endpoint=${NOTIFICATION_SERVICE_URL:https://notify.internal/send}

# FIXED (czr-java-001): Report base path driven by environment variable.
# Set to a volume mount path or S3-backed path in containerised deployments.
app.report.base-path=${REPORT_BASE_PATH:/tmp/reports}
